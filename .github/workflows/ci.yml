name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Build XPI
        run: npm run build

      - name: Verify XPI archive
        run: unzip -t dist/zotero-autonote-*.xpi

